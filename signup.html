<!doctype html><html lang="ko" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>회원가입 — 민준의 기록</title><link rel="stylesheet" href="./css/style.css"><script src="./js/main.js" defer></script></head><body><header class="site-header"><div class="shell header-inner"><a class="brand" href="./index.html"><span class="brand-mark">M.</span><span>민준의 기록</span></a><nav class="desktop-nav"><a href="./index.html">글</a><a href="./profile.html">프로필</a><a href="./write.html">글쓰기</a></nav><div class="header-actions"><button class="icon-button theme-toggle" type="button">◐</button><a class="text-button" href="./login.html">로그인</a><a class="button small" href="./signup.html">시작하기</a><button class="icon-button menu-toggle" type="button">☰</button></div></div><nav class="mobile-nav"><a href="./index.html">글</a><a href="./profile.html">프로필</a><a href="./login.html">로그인</a></nav></header><main class="auth-shell"><section class="auth-side"><div class="auth-quote"><p>당신의 생각에도<br>오래 머물 수 있는<br>자리가 필요하니까.</p><small>오늘부터 한 편씩, 함께 기록해요.</small></div></section><section class="auth-main"><div class="auth-card"><p class="kicker">JOIN THE JOURNEY</p><h1>기록을<br>시작해볼까요?</h1><p>간단한 정보만 입력하면 바로 시작할 수 있어요.</p><form class="form" data-auth-form="signup"><div class="form-row"><div class="field"><label for="name">이름</label><input id="name" name="name" required placeholder="김민준"></div><div class="field"><label for="nickname">닉네임</label><input id="nickname" name="nickname" required placeholder="minjun"></div></div><div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" required placeholder="hello@example.com"></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" required minlength="4" placeholder="4자 이상 입력"></div><label class="check"><input type="checkbox" required> 이용약관 및 개인정보 처리방침에 동의합니다.</label><p class="auth-message" hidden role="status"></p><button class="button" type="submit">회원가입</button><p class="form-switch">이미 계정이 있나요? <a href="./login.html">로그인</a></p></form></div></section></main></body></html>
