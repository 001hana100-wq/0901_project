<!doctype html><html lang="ko" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 글 작성 — 민준의 기록</title><link rel="stylesheet" href="./css/style.css"><script src="./js/main.js" defer></script></head><body><header class="site-header"><div class="shell header-inner"><a class="brand" href="./index.html"><span class="brand-mark">M.</span><span>민준의 기록</span></a><nav class="desktop-nav"><a href="./index.html">글</a><a href="./profile.html">프로필</a><a class="active" href="./write.html">글쓰기</a></nav><div class="header-actions"><button class="icon-button theme-toggle" type="button">◐</button><a class="text-button auth-link" href="./login.html">로그인</a><a class="button small" href="./profile.html">내 프로필</a><button class="icon-button menu-toggle" type="button">☰</button></div></div><nav class="mobile-nav"><a href="./index.html">글 목록</a><a href="./profile.html">프로필</a></nav></header><main><section class="page-hero shell"><p class="kicker">NEW STORY</p><h1 class="page-title">새로운 이야기를<br>들려주세요.</h1><p class="page-subtitle">완벽한 문장보다 솔직한 첫 문장으로 시작해보세요.</p></section><form class="shell editor-shell" data-write-form><section class="editor-main"><label class="field"><span class="kicker">TITLE</span><input class="title-input" name="title" required placeholder="제목을 입력하세요"></label><label class="field"><span class="kicker" style="margin-top:25px">CONTENT</span><textarea name="content" required placeholder="오늘 기록하고 싶은 이야기는 무엇인가요?&#10;&#10;천천히 생각을 적어보세요."></textarea></label></section><aside class="editor-side"><p class="kicker">PUBLISH SETTINGS</p><div class="field"><label for="category">카테고리</label><select id="category" name="category"><option>개발</option><option>디자인</option><option>커리어</option><option>생산성</option><option>일상</option></select></div><div class="field" style="margin-top:18px"><label for="tags">태그</label><input id="tags" name="tags" placeholder="쉼표로 구분"></div><label class="check" style="margin-top:18px"><input type="checkbox" name="comments" checked> 댓글 허용</label><div class="editor-actions"><button class="ghost-button" type="button" data-save-draft>임시 저장</button><button class="button" type="submit">발행하기</button></div><p class="form-status" data-write-status role="status"></p></aside></form></main></body></html>
