<!doctype html><html lang="ko" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 — 민준의 기록</title><link rel="stylesheet" href="./css/style.css"><script src="./js/main.js" defer></script></head><body><header class="site-header"><div class="shell header-inner"><a class="brand" href="./index.html"><span class="brand-mark">M.</span><span>민준의 기록</span></a><nav class="desktop-nav"><a href="./index.html">글</a><a href="./profile.html">프로필</a><a href="./write.html">글쓰기</a></nav><div class="header-actions"><button class="icon-button theme-toggle" type="button" aria-label="테마 전환">◐</button><a class="text-button" href="./login.html">로그인</a><a class="button small" href="./signup.html">시작하기</a><button class="icon-button menu-toggle" type="button">☰</button></div></div><nav class="mobile-nav"><a href="./index.html">글</a><a href="./profile.html">프로필</a><a href="./write.html">글쓰기</a></nav></header><main class="auth-shell"><section class="auth-side"><div class="auth-quote"><p>“기록은 오늘의 내가<br>내일의 나에게 보내는<br>가장 다정한 편지입니다.”</p><small>민준의 기록</small></div></section><section class="auth-main"><div class="auth-card"><p class="kicker">WELCOME BACK</p><h1>다시 만나서<br>반가워요.</h1><p>로그인하고 새로운 글을 이어서 작성해보세요.</p><form class="form" data-auth-form="login"><div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" required placeholder="hello@example.com"></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" required minlength="4" placeholder="비밀번호 입력"></div><label class="check"><input type="checkbox"> 로그인 상태 유지</label><p class="auth-message" hidden role="status"></p><button class="button" type="submit">로그인</button><p class="form-switch">아직 계정이 없나요? <a href="./signup.html">회원가입</a></p></form></div></section></main></body></html>
